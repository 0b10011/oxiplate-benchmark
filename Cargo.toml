[package]
name = "oxiplate-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
criterion = "0.7.0"

# Library with trait all benchmarks use
benchmark = { version = "*", path = "crates/benchmark" }

# Oxiplate versions
oxiplate-0-1 = { version = "*", path = "crates/oxiplate-0-1", optional = true}
oxiplate-0-2 = { version = "*", path = "crates/oxiplate-0-2", optional = true }
oxiplate-0-3 = { version = "*", path = "crates/oxiplate-0-3", optional = true }
oxiplate-0-4 = { version = "*", path = "crates/oxiplate-0-4", optional = true }
oxiplate-0-5 = { version = "*", path = "crates/oxiplate-0-5", optional = true }
oxiplate-0-6 = { version = "*", path = "crates/oxiplate-0-6", optional = true }
oxiplate-0-7 = { version = "*", path = "crates/oxiplate-0-7", optional = true }
oxiplate-0-8 = { version = "*", path = "crates/oxiplate-0-8", optional = true }
oxiplate-0-9 = { version = "*", path = "crates/oxiplate-0-9", optional = true }
oxiplate-0-10 = { version = "*", path = "crates/oxiplate-0-10", optional = true }
oxiplate-0-11 = { version = "*", path = "crates/oxiplate-0-11", optional = true }
oxiplate-0-12 = { version = "*", path = "crates/oxiplate-0-12", optional = true }
oxiplate-0-13 = { version = "*", path = "crates/oxiplate-0-13", optional = true }
oxiplate-0-14 = { version = "*", path = "crates/oxiplate-0-14", optional = true }
oxiplate-0-15 = { version = "*", path = "crates/oxiplate-0-15", optional = true }
oxiplate-0-16 = { version = "*", path = "crates/oxiplate-0-16", optional = true }
oxiplate-0-17 = { version = "*", path = "crates/oxiplate-0-17", optional = true }
oxiplate-0-18 = { version = "*", path = "crates/oxiplate-0-18", optional = true }
oxiplate-0-19 = { version = "*", path = "crates/oxiplate-0-19", optional = true }
oxiplate-0-20 = { version = "*", path = "crates/oxiplate-0-20" }

# Other libraries
askama-latest = { version = "*", path = "crates/askama-latest", optional = true }

[[bench]]
name = "templates"
harness = false

[features]
default = ["recent", "other-libraries"]
all-packages = [
    "dep:oxiplate-0-1",
    "dep:oxiplate-0-2",
    "dep:oxiplate-0-3",
    "dep:oxiplate-0-4",
    "dep:oxiplate-0-5",
    "dep:oxiplate-0-6",
    "dep:oxiplate-0-7",
    "dep:oxiplate-0-8",
    "dep:oxiplate-0-9",
    "dep:oxiplate-0-10",
    "dep:oxiplate-0-11",
    "dep:oxiplate-0-12",
    "dep:oxiplate-0-13",
    "dep:oxiplate-0-14",
    "dep:oxiplate-0-15",
    "dep:oxiplate-0-16",
    "dep:oxiplate-0-17",
    "recent", 
    "other-libraries",
]
recent = [
    "dep:oxiplate-0-18",
    "dep:oxiplate-0-19",
]
other-libraries = ["dep:askama-latest"]
